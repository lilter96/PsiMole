name: Windows desktop

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/windows.yml', 'docs/media/psimole.png', 'guard/assets/domains.txt', 'LICENSE']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows.yml', 'docs/media/psimole.png', 'guard/assets/domains.txt', 'LICENSE']
  workflow_dispatch:
    inputs:
      live_tunnel:
        description: Exercise a live Austrian tunnel and measure throughput
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  installer:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - name: Restore Cargo build cache
        uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: windows-x64-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: windows-x64-
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
      - name: Check crash recovery of the Windows proxy
        run: cargo test --locked --release windows_proxy_recovery_after_crash -- --ignored
      - run: cargo build --locked --release
      - name: Save Cargo build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Build setup
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          }
          & $nsis /V2 installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
      - name: Install, hide, reopen and uninstall
        run: |
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class DesktopWindow {
              private delegate bool WindowCallback(IntPtr window, IntPtr parameter);
              [DllImport("user32.dll")]
              private static extern bool EnumWindows(WindowCallback callback, IntPtr parameter);
              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr window, out int processId);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr window, StringBuilder title, int capacity);
              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr window);
              [DllImport("user32.dll", SetLastError = true)]
              public static extern bool PostMessageW(IntPtr window, uint message, UIntPtr wParam, IntPtr lParam);

              public static IntPtr FindPsiMole(int processId) {
                  IntPtr result = IntPtr.Zero;
                  EnumWindows((window, _) => {
                      GetWindowThreadProcessId(window, out int owner);
                      if (processId != owner || !IsWindowVisible(window)) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(window, title, title.Capacity);
                      if (title.ToString() != "PsiMole") return true;
                      result = window;
                      return false;
                  }, IntPtr.Zero);
                  return result;
              }

              public static string Describe(int processId) {
                  var windows = new List<string>();
                  EnumWindows((window, _) => {
                      GetWindowThreadProcessId(window, out int owner);
                      if (processId != owner) return true;
                      var title = new StringBuilder(256);
                      GetWindowText(window, title, title.Capacity);
                      windows.Add($"{window} visible={IsWindowVisible(window)} title='{title}'");
                      return true;
                  }, IntPtr.Zero);
                  return string.Join(", ", windows);
              }
          }
          '@

          function Wait-For([scriptblock] $Check, [string] $Failure) {
            for ($i = 0; $i -lt 60; $i++) {
              if (& $Check) { return }
              Start-Sleep -Milliseconds 500
            }
            throw $Failure
          }

          $setup = Start-Process -FilePath '.\PsiMole-Setup-x64.exe' -ArgumentList '/S' -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Setup exited with $($setup.ExitCode)" }
          $install = Join-Path $env:LOCALAPPDATA 'Programs\PsiMole'
          $exe = Join-Path $install 'PsiMole.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'PsiMole.lnk'
          if (!(Test-Path $shortcut)) { throw 'Start menu shortcut missing' }

          $app = Start-Process -FilePath $exe -PassThru
          Wait-For { [DesktopWindow]::FindPsiMole($app.Id) -ne [IntPtr]::Zero } 'Window failed to open'
          $startupLog = Join-Path $env:LOCALAPPDATA 'PsiMole\startup-error.txt'
          if (Test-Path $startupLog) { throw (Get-Content -Raw $startupLog) }
          $window = [DesktopWindow]::FindPsiMole($app.Id)
          Write-Host "Testing PsiMole process $($app.Id), window $window"
          for ($cycle = 1; $cycle -le 8; $cycle++) {
            if (![DesktopWindow]::PostMessageW($window, 0x0010, [UIntPtr]::Zero, [IntPtr]::Zero)) {
              throw "Could not send WM_CLOSE ($([Runtime.InteropServices.Marshal]::GetLastWin32Error()))"
            }
            Wait-For {
              $app.Refresh()
              if ($app.HasExited) { throw "Window close exited the process with $($app.ExitCode)" }
              ![DesktopWindow]::IsWindowVisible($window)
            } "Window did not hide on cycle $cycle"
            $second = Start-Process -FilePath $exe -PassThru
            if (!$second.WaitForExit(15000)) {
              Stop-Process -Id $second.Id -Force
              throw "Second launch did not acknowledge the window on cycle $cycle"
            }
            if ($second.ExitCode -ne 0) { throw "Second launch failed on cycle $cycle" }
            $app.Refresh()
            Write-Host "Cycle $cycle, app exited=$($app.HasExited), windows: $([DesktopWindow]::Describe($app.Id))"
            Wait-For {
              [DesktopWindow]::FindPsiMole($app.Id) -eq $window
            } "Second launch did not restore the same window on cycle $cycle"
          }
          $quit = Start-Process -FilePath $exe -ArgumentList '--quit-if-running' -PassThru -Wait
          if ($quit.ExitCode -ne 0 -or !$app.WaitForExit(10000)) { throw 'Quit did not stop the app' }

          $remove = Start-Process -FilePath (Join-Path $install 'Uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          if ($remove.ExitCode -ne 0) { throw "Uninstall exited with $($remove.ExitCode)" }
          Wait-For { !(Test-Path $exe) -and !(Test-Path $shortcut) } 'Uninstall did not remove app and shortcut'
      - name: Write setup checksum
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\PsiMole-Setup-x64.exe).Hash.ToLowerInvariant()
          "$hash  PsiMole-Setup-x64.exe" | Set-Content -Encoding ascii .\PsiMole-Setup-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PsiMole-Windows-x64
          path: |
            desktop/PsiMole-Setup-x64.exe
            desktop/PsiMole-Setup-x64.exe.sha256
          if-no-files-found: error
      - name: Download Psiphon, establish an Austrian tunnel and measure throughput
        if: inputs.live_tunnel
        run: cargo test --locked --release live_austrian_tunnel -- --ignored --nocapture
