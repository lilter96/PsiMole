[package]
name = "psimole"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
sha2 = "0.10"
tempfile = "3"
tray-icon = { version = "0.26", default-features = false }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
